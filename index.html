<style>
:root{

  --shadow-lg:0 12px 40px -12px rgba(40,35,20,.18);

  --radius-sm:12px;
  --radius-full:999px;
  --transition:all .22s cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:dark){

    --bg:#12100c;--card:#1a1710;--ink:#f2ebd8;--mute:#a89a78;

    --stamp:#d44;--shadow:0 4px 24px -6px rgba(0,0,0,.45);
    --shadow-lg:0 14px 44px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#12100c;--card:#1a1710;--ink:#f2ebd8;--mute:#a89a78;
  --rule:#2e291c;--accent:#e0b04a;--accent2:#6a9abb;--accent-ink:#1f1600;
  --stamp:#d44;--shadow:0 4px 24px -6px rgba(0,0,0,.45);
  --shadow-lg:0 14px 44px -12px rgba(0,0,0,.55);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0);-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Vazirmatn,Tahoma,system-ui,sans-serif;
  line-height:1.8;
  overflow-x:hidden;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 120% 80% at 50% -20%, color-mix(in srgb,var(--accent2) 8%,transparent), transparent 60%),
    radial-gradient(ellipse 80% 50% at 100% 100%, color-mix(in srgb,var(--accent) 6%,transparent), transparent 50%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body,
  :root[data-theme="dark"] body{
    background-image:
      radial-gradient(ellipse 120% 80% at 50% -20%, rgba(106,154,187,.12), transparent 60%),
      radial-gradient(ellipse 80% 50% at 100% 100%, rgba(224,176,74,.07), transparent 50%);
  }
}
main{max-width:920px;margin:0 auto;padding:0 18px 80px}
.hero{position:relative;margin:16px 0 6px;padding:40px 18px 34px;text-align:center;display:flex;flex-direction:column;align-items:center;border-radius:28px;overflow:hidden;isolation:isolate;background:radial-gradient(140px 100px at 8% 16%, rgba(224,176,74,.5), transparent 70%),radial-gradient(160px 120px at 96% 86%, rgba(42,77,110,.14), transparent 72%),linear-gradient(165deg,#fffaf3 0%,#f7ecd6 52%,#f1e0be 100%);border:1px solid #e7d8b8;box-shadow:0 18px 40px -22px rgba(40,35,20,.4)}
.hb{position:absolute;z-index:0;border-radius:12px;pointer-events:none}
.hb.s1{width:36px;height:36px;background:#e0b04a;top:18px;inset-inline-end:18px}
.hb.s2{width:16px;height:16px;background:#2a4d6e;top:46px;inset-inline-start:26px;opacity:.5}
.hb.s3{width:22px;height:22px;background:#c47a1a;bottom:22px;inset-inline-start:18px;opacity:.85}
.hb.s4{width:28px;height:28px;background:#ffd84d;bottom:18px;inset-inline-end:34px}
.hero-icon,.brand-name,.free-tag{position:relative;z-index:1}
html.banner-enter .hb{animation:hbIn .85s cubic-bezier(.2,.7,.2,1) both}
html.banner-enter .hb.s2{animation-delay:.08s}
html.banner-enter .hb.s3{animation-delay:.14s}
html.banner-enter .hb.s4{animation-delay:.2s}
@keyframes hbIn{from{opacity:0;transform:translateY(16px) scale(.55)}to{opacity:1;transform:none}}
:root[data-theme="dark"] .hero{background:radial-gradient(140px 100px at 8% 16%, rgba(224,176,74,.28), transparent 70%),radial-gradient(160px 120px at 96% 86%, rgba(106,154,187,.2), transparent 72%),linear-gradient(165deg,#2c261c,#1a1710 72%);border-color:#3a3320}
.hero-icon{width:82px;height:82px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(145deg,var(--accent) 0%,var(--accent2) 100%);box-shadow:0 16px 36px -10px color-mix(in srgb,var(--accent2) 45%,transparent),0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent)}
.brand-name{font-weight:900;font-size:clamp(2.4rem,6vw,3.4rem);margin:22px 0 0;letter-spacing:-.5px;line-height:1.05;color:var(--ink)}
.free-tag{margin:10px 0 0;font-size:1.05rem;font-weight:800;color:var(--accent2);letter-spacing:.2px}
.subtag{color:var(--mute);margin:16px auto 0;font-size:.95rem;max-width:52ch;line-height:1.85}
.section-label{display:flex;align-items:center;gap:12px;margin:42px 0 18px}
.section-label h2{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:.3px;color:var(--ink);white-space:nowrap}
.section-label .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),transparent)}
.search-wrap{margin:26px auto 6px;max-width:480px;width:100%;position:relative}
.search-wrap input{width:100%;padding-block:15px;padding-inline:20px 52px;border:1.5px solid var(--rule);border-radius:var(--radius-full);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;outline:none;box-shadow:var(--shadow);transition:var(--transition)}
.search-wrap input:focus{border-color:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 16%,transparent),var(--shadow)}
.search-icon{position:absolute;inset-inline-end:18px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none;transition:color .2s;display:flex;align-items:center;justify-content:center}
.search-wrap:focus-within .search-icon{color:var(--accent2)}

@media (max-width:560px){
  .brand-name{font-size:2.35rem}
  .hero-icon{width:70px;height:70px;border-radius:20px}
  .hero{padding:32px 14px 28px}
  .search-wrap{margin-top:16px}
}
</style>
