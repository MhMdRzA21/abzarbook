<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ابزاربوک | ۲۴ ابزار رایگان محاسبه حقوق، مالی و کاربردی</title>
<meta name="description" content="ابزاربوک: مرجع رایگان محاسبه عیدی و سنوات ۱۴۰۵، حقوق و مالیات، اقساط وام، کمیسیون املاک، مهریه و ده‌ها ابزار دیگر. دقیق، بدون ثبت‌نام، با نمایش عدد به حروف.">
<meta name="keywords" content="ابزاربوک, ابزار بوک, محاسبه عیدی ۱۴۰۵, محاسبه سنوات, محاسبه حقوق و مالیات, کمیسیون مشاور املاک, محاسبه اضافه کاری, شب کاری, مهریه به نرخ روز, تبدیل رهن به اجاره, وام ازدواج, مبدل واحد, محاسبه سن شمسی, تقویم شمسی, ساخت QR کد, رمزساز, ابزار متن فارسی, عدد به حروف, جداکننده هزارگان">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://abzarbook.ir/">
<style>html,body{margin:0;padding:0}#boot{font-family:Tahoma,sans-serif;text-align:center;padding:48px;color:#444}</style>
</head>
<body>
<p id="boot">در حال بارگذاری...</p>
<script>
(async function () {
  var urls = [
    'https://cdn.jsdelivr.net/gh/MhMdRzA21/abzarbook@eb24040f/index.html',
    'https://raw.githubusercontent.com/MhMdRzA21/abzarbook/eb24040f/index.html'
  ];
  var html = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var res = await fetch(urls[i], { cache: 'no-store' });
      if (res.ok) { html = await res.text(); break; }
    } catch (e) {}
  }
  if (!html) {
    document.getElementById('boot').textContent = 'خطا در بارگذاری. یک‌بار رفرش کنید.';
    return;
  }
  var marker = '<div class="section-label"><h2>چرا ابزاربوک بهترین انتخاب است؟</h2>';
  var inject = '<div class="section-label"><h2>تبدیل و فشرده‌سازی فایل</h2><div class="ln"></div></div>\n'
    + '<div class="ledger" style="margin-bottom:28px">'
    + '<a class="row" href="/convert/">'
    + '<span class="icn" style="background:linear-gradient(155deg,#2563eb,#1e3a8a)"><svg width="33" height="33" viewBox="0 0 24 24" fill="none"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" stroke="#fff" stroke-width="1.6" fill="none"/><path d="M14 2v6h6" stroke="#fff" stroke-width="1.6"/></svg></span>'
    + '<span class="rbody"><span class="rtitle">مبدل فایل (PDF، ورد، تصویر)</span>'
    + '<span class="rdesc">ادغام و تقسیم PDF، تبدیل PDF به ورد و بالعکس، فشرده‌سازی — رایگان و بدون ثبت‌نام.</span>'
    + '<span class="preview">ورود به بخش تبدیل فایل ←</span></span></a></div>\n' + marker;
  if (html.indexOf(marker) !== -1) html = html.replace(marker, inject);
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
