<h1>درباره ابزارها</h1>
<p>ابزاربوک یک جعبه ابزار آنلاین فارسی است. محاسبه عیدی و سنوات، رهن و وام، مبدل فایل، تست تایپ و ابزار متن اینجاست.</p>
<p>ابزارهای محاسباتی در مرورگر اجرا می‌شوند و چیزی ذخیره نمی‌کنند. فایل‌های تبدیل بعد از دانلود پاک می‌شوند.</p>
