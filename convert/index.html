<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تبدیل فایل آنلاین — ادغام، تقسیم، فشرده‌سازی | ابزاربوک</title>
<meta name="description" content="تبدیل آنلاین PDF: ادغام، تقسیم، فشرده‌سازی، PDF به ورد و ورد به PDF. رایگان و بدون ثبت‌نام.">
<link rel="canonical" href="https://abzarbook.ir/convert/">
<meta name="robots" content="index,follow">
<style>html,body{margin:0}#boot{font-family:Tahoma,sans-serif;text-align:center;padding:40px;color:#444}</style>
</head>
<body>
<p id="boot">در حال بارگذاری مبدل فایل...</p>
<script>
(async function () {
  var urls = [
    'https://cdn.jsdelivr.net/gh/MhMdRzA21/Converter@main/public/home.html',
    'https://raw.githubusercontent.com/MhMdRzA21/Converter/main/public/home.html'
  ];
  var html = null;
  for (var i = 0; i < urls.length; i++) {
    try {
      var res = await fetch(urls[i], { cache: 'no-store' });
      if (res.ok) { html = await res.text(); break; }
    } catch (e) {}
  }
  if (!html) {
    document.getElementById('boot').textContent = 'خطا در بارگذاری. رفرش کنید.';
    return;
  }
  // Paths -> /convert/
  html = html
    .replace(/lang="en" dir="ltr"/g, 'lang="fa" dir="rtl"')
    .replace(/Converta/g, 'ابزاربوک')
    .replace(/<span class="mark">CV<\/span>/g, '<span class="mark">ابز</span>')
    .replace(/href="\/css\//g, 'href="/convert/css/')
    .replace(/src="\/js\//g, 'src="/convert/js/')
    .replace(/href="\/favicon/g, 'href="/convert/favicon')
    .replace(/href="\/fonts\//g, 'href="/convert/fonts/')
    .replace(/href="\/home\.html"/g, 'href="/convert/"')
    .replace(/href="\/tools\.html"/g, 'href="/convert/tools.html"')
    .replace(/href="\/guides\//g, 'href="/convert/guides/')
    .replace(/href="\/pages\//g, 'href="/convert/pages/')
    .replace(/href="\/compress\//g, 'href="/convert/compress/')
    .replace(/href="\/convert\//g, 'href="/convert/')
    .replace(/https:\/\/YOURDOMAIN\.com/g, 'https://abzarbook.ir/convert')
    .replace(/Convert your files right here/g, 'فایل‌هات رو همین‌جا تبدیل کن')
    .replace(/>Tools</g, '>ابزارها<')
    .replace(/>Guides</g, '>راهنماها<')
    .replace(/>FAQ</g, '>سوالات متداول<')
    .replace(/>About</g, '>درباره ما<')
    .replace(/>Merge PDF</g, '>ادغام PDF<')
    .replace(/>Split PDF</g, '>تقسیم PDF<')
    .replace(/>Compress files</g, '>فشرده‌سازی<')
    .replace(/>Convert</g, '>تبدیل<')
    .replace(/>Convert to PDF</g, '>تبدیل به PDF<')
    .replace(/>Merge PDFs</g, '>ادغام PDFها<')
    .replace(/>Compress</g, '>فشرده‌سازی<')
    .replace(/Drop images here, or click to browse/g, 'تصاویر را اینجا رها کنید یا کلیک کنید')
    .replace(/Drop a PDF here, or click to browse/g, 'فایل PDF را اینجا رها کنید یا کلیک کنید')
    .replace(/Drop PDF files here, or click to browse/g, 'فایل‌های PDF را اینجا رها کنید یا کلیک کنید')
    .replace(/Drop a file here, or click to browse/g, 'فایل را اینجا رها کنید یا کلیک کنید')
    .replace(/Drop a Word, Excel, PowerPoint or PDF file here/g, 'فایل ورد، اکسل، پاورپوینت یا PDF را اینجا رها کنید')
    .replace(/Popular conversions/g, 'تبدیل‌های پرکاربرد')
    .replace(/Why this site/g, 'چرا ابزاربوک؟');

  // Inject Vazirmatn + ensure CSS from /convert/
  if (html.indexOf('Vazirmatn') === -1) {
    html = html.replace('</head>',
      '<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">\n'
      + '<style>html[dir=rtl] body{font-family:Vazirmatn,Tahoma,sans-serif;direction:rtl}'
      + 'html[dir=rtl] .site-header .wrap,html[dir=rtl] .site-nav{flex-direction:row-reverse}'
      + 'html[dir=rtl] .tabs{flex-direction:row-reverse;flex-wrap:wrap}</style>\n</head>');
  }
  // Link back to abzarbook home in nav if possible
  html = html.replace(
    '<nav class="site-nav">',
    '<nav class="site-nav"><a href="/">ابزاربوک</a>'
  );

  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
